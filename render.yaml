services:
  - type: web
    name: farben-aicc
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: node server.js --data ./aicc-data
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: AICC_ADMIN_PASSWORD
        generateValue: true
